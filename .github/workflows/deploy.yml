name: Deploy Dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check file size
        run: |
          SIZE=$(wc -c < index.html)
          MAX_SIZE=700000
          if [ $SIZE -gt $MAX_SIZE ]; then
            echo "❌ File size check failed: $SIZE bytes (max $MAX_SIZE)"
            exit 1
          fi
          echo "✅ File size check passed: $SIZE bytes"

      - name: Scan for secrets
        run: |
          SECRETS=("SUPABASE_SERVICE_ROLE_KEY" "METRICOOL_API_TOKEN" "SUPABASE_ANON_KEY" "GITHUB_TOKEN" "PRIVATE_KEY")
          FOUND_SECRETS=0
          for secret in "${SECRETS[@]}"; do
            if grep -q "$secret" index.html; then
              echo "❌ Potential secret found: $secret"
              FOUND_SECRETS=1
            fi
          done
          if [ $FOUND_SECRETS -eq 1 ]; then
            exit 1
          fi
          echo "✅ Secret scan passed: no secrets detected"

      - name: Verify required IDs
        run: |
          REQUIRED_IDS=("gate" "gu" "gp" "gform" "sec-posts" "sec-market" "sec-geo" "navSec")
          MISSING=0
          for id in "${REQUIRED_IDS[@]}"; do
            if ! grep -q "id=['\"]$id['\"]" index.html && ! grep -q "id=$id" index.html; then
              echo "❌ Missing required ID: $id"
              MISSING=1
            fi
          done
          if [ $MISSING -eq 1 ]; then
            exit 1
          fi
          echo "✅ Required IDs check passed: all IDs present"

      - name: Validate HTML syntax
        run: |
          if ! grep -q "<!doctype html>" index.html; then
            echo "❌ HTML syntax check failed: missing DOCTYPE"
            exit 1
          fi
          if ! grep -q "</html>" index.html; then
            echo "❌ HTML syntax check failed: missing closing </html>"
            exit 1
          fi
          echo "✅ HTML syntax check passed"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          cname: tjsuduku.github.io/cloverdale-paint-dashboard

      - name: Report deployment status
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All checks passed" >> $GITHUB_STEP_SUMMARY
          echo "- File size: < 700 KB" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets scan: clear" >> $GITHUB_STEP_SUMMARY
          echo "- Required IDs: present" >> $GITHUB_STEP_SUMMARY
          echo "- HTML syntax: valid" >> $GITHUB_STEP_SUMMARY
          echo "- Deployed to: https://tjsuduku.github.io/cloverdale-paint-dashboard/" >> $GITHUB_STEP_SUMMARY
